<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Emoji priority -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>und-zsye</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Latin font has no CJK glyphs: CJK fallback, switched by set-cjk-font (only for this family) -->
  <alias>
    <family>Fizzy Bubbles Code</family>
    <accept><family>StarLovePencil</family></accept>
  </alias>

</fontconfig>
