# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    # JankyBorders has a built-in detection of already running process,
    # so it won't be run twice on AeroSpace restart
    'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar',
    # no arguments: borders reads ~/.config/borders/bordersrc (colours from the desktop theme)
    'exec-and-forget borders'
]

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 13
inner.vertical = 13
outer.left = 13
outer.bottom = 13
outer.top = 36
outer.right = 13

# NOTE: No [workspace-to-monitor-force-assignment] here on purpose.
# We want dwm-style behavior: a workspace is summoned onto whatever monitor
# is currently focused (see the cmd-N bindings using 'summon-workspace').
# Force-assigning a workspace would pin it to one monitor and break summoning.

# See https://nikitabobko.github.io/AeroSpace/guide#exec-env-vars
[exec] # Again, you don't need to copy all config sections to your config.
inherit-env-vars = true # If you don't touch "exec" section,
[exec.env-vars] # it will fallback to "default-config.toml"
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with cmd + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# cmd-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
cmd-shift-slash = 'layout accordion horizontal vertical'
cmd-shift-backslash = 'layout tiles horizontal vertical'


# alt-enter = 'exec-and-forget open -n /Applications/Alacritty.app' # use Super + N to open new alacritty terminal
cmd-enter = 'exec-and-forget open -n /Applications/Alacritty.app' # use Super + N to open new alacritty terminal 
cmd-e = 'exec-and-forget emacsclient -c --alternate-editor=emacs --no-wait $@'

# Keys follow dwm on Linux (desktop/linux/dwm/config.def.h), with Cmd as Mod. dwm keys that are core
# macOS app shortcuts stay with the apps: Cmd-V/F/T/O/I/U/Y/Space/comma/period (paste, find, new tab,
# ...), and Mod+Tab (Cmd-Tab is the app switcher: alt-tab below).
cmd-d = 'exec-and-forget $HOME/.local/bin/dmenu_run'             # dmenu (desktop/mac/dmenu)
cmd-shift-d = "exec-and-forget osascript -e 'tell application \"System Events\" to key code 49 using {control down, command down}'"  # emoji picker (show_emoji)
cmd-shift-w = 'exec-and-forget /Applications/Firefox.app/Contents/MacOS/firefox --new-window'
cmd-shift-e = "exec-and-forget emacsclient -a '' --eval '(emacs-everywhere)'"  # edit any text field in Emacs (everywhere)
cmd-shift-b = 'exec-and-forget sketchybar --bar hidden=toggle'   # togglebar
cmd-shift-space = 'layout tiles accordion'                        # cyclelayout (Cmd-Space stays Spotlight)
cmd-shift-f5 = ['reload-config', 'exec-and-forget sketchybar --reload']   # dwm: reload colours (xrdb)
cmd-shift-comma = 'move-node-to-monitor --wrap-around prev'      # tagmon
cmd-shift-period = 'move-node-to-monitor --wrap-around next'
cmd-q = 'close'

cmd-m = 'fullscreen'
# NOTE: cmd-arrow bindings are handled by skhd (~/.config/skhd/skhdrc), not here.
# Hardware arrow-key events carry an implicit 'fn' flag that AeroSpace's hotkey
# matching rejects, so these bindings never fire from a real keyboard:
#   cmd-left  -> workspace --wrap-around prev
#   cmd-right -> workspace --wrap-around next
#   cmd-up    -> focus-monitor prev
#   cmd-down  -> focus-monitor next
cmd-shift-leftSquareBracket = 'move-workspace-to-monitor --wrap-around prev'
cmd-shift-rightSquareBracket = 'move-workspace-to-monitor --wrap-around next'
cmd-shift-c = 'reload-config'
cmd-shift-f = 'layout floating tiling' # 'floating toggle' in i3

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-shift-m = 'mode manage'
cmd-shift-r = 'mode resize'

# dwm stack keys: Mod+j/k focus the next/previous window, Mod+Shift+j/k push it along the stack,
# Mod+h/l shrink/grow the master area. AeroSpace has no master/stack: its window (dfs) order is the
# stack, and h/l resize the focused window.
cmd-j = 'focus --wrap-around dfs-next'
cmd-k = 'focus --wrap-around dfs-prev'
cmd-h = 'resize smart -50'
cmd-l = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-shift-h = 'move left'
cmd-shift-j = 'swap --swap-focus --wrap-around dfs-next'
cmd-shift-k = 'swap --swap-focus --wrap-around dfs-prev'
cmd-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
cmd-shift-minus = 'resize smart -50'
cmd-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
# dwm-style: 'summon-workspace' pulls workspace N onto the CURRENTLY FOCUSED
# monitor and focuses it (instead of jumping focus to the workspace's home).
# Workflow: focus a monitor (cmd-up / cmd-down), then press cmd-N to bring
# that workspace onto the screen you're looking at.
# See: https://nikitabobko.github.io/AeroSpace/commands#summon-workspace
cmd-1 = 'summon-workspace 1'
cmd-2 = 'summon-workspace 2'
cmd-3 = 'summon-workspace 3'
cmd-4 = 'summon-workspace 4'
cmd-5 = 'summon-workspace 5'
cmd-6 = 'summon-workspace 6'
cmd-7 = 'summon-workspace 7'
cmd-8 = 'summon-workspace 8'
cmd-9 = 'summon-workspace 9'
cmd-0 = 'summon-workspace 10'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 10'

cmd-ctrl-1 = ['move-node-to-workspace 1', 'summon-workspace 1']
cmd-ctrl-2 = ['move-node-to-workspace 2', 'summon-workspace 2']
cmd-ctrl-3 = ['move-node-to-workspace 3', 'summon-workspace 3']
cmd-ctrl-4 = ['move-node-to-workspace 4', 'summon-workspace 4']
cmd-ctrl-5 = ['move-node-to-workspace 5', 'summon-workspace 5']
cmd-ctrl-6 = ['move-node-to-workspace 6', 'summon-workspace 6']
cmd-ctrl-7 = ['move-node-to-workspace 7', 'summon-workspace 7']
cmd-ctrl-8 = ['move-node-to-workspace 8', 'summon-workspace 8']
cmd-ctrl-9 = ['move-node-to-workspace 9', 'summon-workspace 9']
cmd-ctrl-0 = ['move-node-to-workspace 10', 'summon-workspace 10']

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
# NOTE: kept on alt — cmd-tab is reserved by the macOS app switcher and can't be intercepted.
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Swap the visible workspaces between the two monitors (script-driven).
cmd-shift-s = 'exec-and-forget /Users/hylan/.config/aerospace/scripts/swap-monitors.sh'

# Reload sketchybar
# NOTE: kept on alt — cmd-shift-r is already taken by 'mode resize' above.
alt-shift-r = ['exec-and-forget /opt/homebrew/bin/sketchybar --reload']

# 'manage' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.manage.binding]
enter = 'mode main'
c = ['reload-config', 'mode main'] # reload config
esc = [
  'reload-config',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = [
    'layout floating tiling',
    'mode main',
    'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
] # Toggle between floating and tiling layout
backspace = [
  'close-all-windows-but-current',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]

h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# --- Picture-in-Picture video: keep it FLOATING (never tiled) ---
# These PiP rules MUST come before the generic Firefox->workspace-10 rule:
# AeroSpace only runs the FIRST matching on-window-detected rule, so without
# this ordering a Firefox PiP window would be sent to workspace 10 instead.
#
# NOTE on "sticky": AeroSpace cannot pin a window so it's visible on every
# workspace — that's an open upstream limitation (issue #2). A floating window
# still hides when you switch away from its workspace. See README for the
# multi-monitor workaround (park PiP on one screen, work on the other).
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
if.window-title-regex-substring = "Picture-in-Picture"
if.during-aerospace-startup = false
run = "layout floating"

[[on-window-detected]]
if.app-id = 'app.floorp.Floorp'
if.window-title-regex-substring = "Picture-in-Picture"
if.during-aerospace-startup = false
run = "layout floating"

# Generic Firefox windows go to workspace 10.
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 10'

[[on-window-detected]]
if.window-title-regex-substring = "mpv"
if.during-aerospace-startup = false
run =  "layout floating"

#exec-on-workspace-change = ['$HOME/.config/aerospace/scripts/on-ws-change.sh']

